name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: python3 tools/check_public_tree.py --history
      - run: |
          cmake -S tests -B build-host -G Ninja
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements.txt
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
  esp32s3:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - shell: bash
        run: |
          tools/bootstrap.sh --patch-sdk /opt/esp/idf
          python3 tools/test_sdk_https_cleanup.py --sdk /opt/esp/idf
          . /opt/esp/idf/export.sh
          python -m pip install -r tools/requirements-sdk.txt
          idf.py set-target esp32s3
          idf.py build
          idf.py size
          python tools/check_stack_budget.py --build build
          python tools/test_signed_firmware.py --build build
          idf.py -B build-bench -D SDKCONFIG="$PWD/build-bench/sdkconfig" -D IDF_TARGET=esp32s3 -D TSL_USB_RELAY_BENCH=ON build

  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
